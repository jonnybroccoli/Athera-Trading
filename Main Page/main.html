<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atheramons</title>

    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="topbar">
        <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
            <img id="logo" src="../Assets/atheralogo.png">
            <span id="name">Atheramons</span>
        </div>
        <div style="position: relative; flex: 1; max-width: 400px;">
            <input type="text" id="search-input" placeholder="Search">
            <div id="search-dropdown"></div>
        </div>
        <div class="nav">
            <button class="home-btn" onclick="window.location.href='../Main Page/main.html'">Home</button>
            <button class="post-btn" onclick="window.location.href='../Post Listing Page/post.html'">Post Trade</button>
            <button class="inbox-btn" onclick="window.location.href='../Inbox Messaging Page/inbox.html'">Inbox</button>
            <button class="profile-btn"
                onclick="window.location.href='../User Profile Page/profile.html'">Profile</button>
            <button class="dsc-button">
                <i class="fa-brands fa-discord"></i> Verify with Discord
            </button>
        </div>
    </div>

    <!-- Limiteds Section -->
    <div class="section">
        <div class="section-header">
            <h2>New Athera Limiteds</h2>
            <button class="view-all-btn">View All</button>
        </div>
        <div class="limiteds-row" id="limiteds-row">
            <!-- Populated by main.js -->
        </div>
    </div>

    <!-- Recent Trades Section -->
    <div class="section">
        <div class="section-header">
            <h2>Recent Trade Listings</h2>
            <button class="view-all-btn">View All</button>
        </div>
        <div class="trades-row" id="trades-row">
            <!-- Populated by main.js -->
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
